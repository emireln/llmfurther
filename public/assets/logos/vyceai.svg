<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">Vyce AI</title>
  <desc id="desc">Vyce AI glowing blue V mark on a deep navy background</desc>
  <defs>
    <linearGradient id="vyce-background" x1="8" y1="6" x2="40" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263653"/>
      <stop offset="1" stop-color="#0D1728"/>
    </linearGradient>
    <linearGradient id="vyce-v-gradient" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7EAFF"/>
      <stop offset="0.38" stop-color="#63B3FF"/>
      <stop offset="0.72" stop-color="#3182F6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="vyce-sheen" x1="10" y1="7" x2="38" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="vyce-glow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#vyce-background)"/>
  <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#vyce-sheen)"/>
  <path d="M11.5 13.5C14.2 13.5 16.6 13.5 19.5 13.5L24 25.6L28.5 13.5C31.4 13.5 33.8 13.5 36.5 13.5L28.1 34.5C25.4 35.3 22.6 35.3 19.9 34.5L11.5 13.5Z" fill="url(#vyce-v-gradient)" filter="url(#vyce-glow)"/>
  <path d="M12 14h7.4L24 25.8 28.6 14H36" fill="none" stroke="#E4F3FF" stroke-opacity=".68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="13.5" fill="none" stroke="#8DBBFF" stroke-opacity=".2"/>
</svg>
